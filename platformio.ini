[platformio]
src_dir = src

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
  madhephaestus/ESP32Servo

[env:base]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

board_build.partitions = min_spiffs.csv

lib_deps =

build_src_filter =
  -<**>
  +<base/main.cpp>
  +<base/baseF.cpp>
  +<base/cenasBase.cpp>

[env:bracos]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
monitor_filters =
  send_on_enter

build_src_filter =
  -<**>
  +<bracos/main.cpp>
  +<bracos/bracosF.cpp>

[env:teste]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

build_src_filter =
  -<**>
  +<teste/teste.cpp>